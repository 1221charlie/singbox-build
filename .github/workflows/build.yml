name: Build sing-box Android (trimmed, arm64-v8a)

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "sing-box core tag. Leave empty to auto-match the Android shell version"
        required: false
        default: ""
      app_ref:
        description: "sing-box-for-android tag or branch. Leave empty for its default branch"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout official Android shell
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: ${{ inputs.app_ref }}
          path: sing-box-for-android
          submodules: recursive
          fetch-depth: 0

      - name: Pick the sing-box core that matches the shell
        id: core
        run: |
          VN=$(grep '^VERSION_NAME' sing-box-for-android/version.properties | cut -d= -f2 | tr -d "\"' \r")
          CORE=https://github.com/SagerNet/sing-box
          WANT="${{ inputs.core_ref }}"
          if [ -z "$WANT" ]; then WANT="v$VN"; fi
          REF=""
          for c in "$WANT" "v${WANT#v}" "${WANT#v}"; do
            if git ls-remote --exit-code --tags "$CORE" "refs/tags/$c" > /dev/null 2>&1; then
              REF="$c"
              break
            fi
          done
          if [ -z "$REF" ]; then
            echo "::warning::core tag for $WANT not found, using the core default branch"
          fi
          echo "core_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::warning::INFO shell version=$VN, core ref=${REF:-default branch}"
          echo "shell version: $VN / core ref: ${REF:-default branch}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.core.outputs.core_ref }}
          path: sing-box
          fetch-depth: 0

      - name: Read Go and NDK versions required by the shell
        id: ver
        run: |
          GO_VER=$(grep '^GO_VERSION' sing-box-for-android/version.properties | cut -d= -f2 | tr -d "\"' \r")
          NDK_VER=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' sing-box-for-android/app/build.gradle.kts | head -1 || true)
          NDK_VER=${NDK_VER:-28.0.13004108}
          echo "go=${GO_VER#go}" >> "$GITHUB_OUTPUT"
          echo "ndk=${NDK_VER}" >> "$GITHUB_OUTPUT"
          echo "Go: ${GO_VER}  NDK: ${NDK_VER}"
          cat sing-box-for-android/version.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.ver.outputs.go }}
          cache: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK" 2>/dev/null || sudo mkdir -p "$SDK"
          [ -w "$SDK" ] || sudo chown -R "$(id -u):$(id -g)" "$SDK"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found, downloading Android command line tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/cmdtools/cmdline-tools/. "$SDK/cmdline-tools/latest/"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "using sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "ndk;${{ steps.ver.outputs.ndk }}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${{ steps.ver.outputs.ndk }}" >> "$GITHUB_ENV"

      - name: Trim build tags (keep utls, dhcp, clash_api, conntrack, low_memory)
        run: |
          python3 - <<'PY'
          import re, pathlib
          drop = [
              "with_quic", "with_wireguard", "with_acme", "with_tailscale",
              "with_gvisor", "with_ech", "with_naive_outbound", "with_ccm",
              "with_ocm", "with_cloudflared", "with_reality_server",
              "with_grpc", "with_v2ray_api", "with_purego",
          ]
          root = pathlib.Path("sing-box")
          files = [root / "Makefile"] + list((root / "cmd" / "internal").rglob("*.go"))
          changed = []
          for f in files:
              if not f.is_file() or f.name.endswith("_test.go"):
                  continue
              s = f.read_text()
              o = s
              for t in drop:
                  s = re.sub(r"(?<![A-Za-z0-9_])" + t + r"(?![A-Za-z0-9_]),?", "", s)
              if s != o:
                  f.write_text(s)
                  changed.append(str(f))
          print("patched files:", changed)
          PY
          echo "---- tags now present in build files ----"
          grep -rn "with_" sing-box/Makefile sing-box/cmd/internal || true
          grep -rq "with_utls" sing-box/Makefile sing-box/cmd/internal || echo "::warning::with_utls not found in build files, check the log above"

      - name: Build libbox.aar
        working-directory: sing-box
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_install
          make lib_android
          mkdir -p ../sing-box-for-android/app/libs
          cp -f ./*.aar ../sing-box-for-android/app/libs/ 2>/dev/null || true
          ls -lh ../sing-box-for-android/app/libs

      - name: Create signing key
        working-directory: sing-box-for-android
        run: |
          keytool -genkeypair -keystore release.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass 123456 -keypass 123456 -dname "CN=local"
          cp release.keystore app/release.keystore
          printf 'KEYSTORE_PASS=123456\nALIAS_NAME=key0\nALIAS_PASS=123456\n' > local.properties
          echo "LOCAL_PROPERTIES=$(base64 -w0 local.properties)" >> "$GITHUB_ENV"
          echo "---- signing related lines in app/build.gradle.kts ----"
          grep -n -i -E "keystore|storeFile|getProps|signingConfig" app/build.gradle.kts | head -40 || true

      - name: Build APK
        working-directory: sing-box-for-android
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleOtherRelease > "$RUNNER_TEMP/release.log" 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then exit 0; fi
          echo "::warning::release build failed, trying debug build"
          ./gradlew --no-daemon --stacktrace assembleOtherDebug > "$RUNNER_TEMP/debug.log" 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then exit 0; fi

          emit() {
            while IFS= read -r l; do
              l="${l:0:280}"
              l="${l//%/%25}"
              echo "::error::$1 $l"
            done
          }
          block() {
            awk '/What went wrong/{f=1} f{print} /^\* Try/{f=0}' "$1" | head -30
            grep -E '^e: |error:|Unresolved reference|Could not resolve|No matching variant|Task .* FAILED' "$1" | head -20
          }
          {
            echo '### release build errors'
            echo '```'
            block "$RUNNER_TEMP/release.log"
            echo '```'
            echo '### debug build errors'
            echo '```'
            block "$RUNNER_TEMP/debug.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          block "$RUNNER_TEMP/release.log" | head -3 | emit "[release]"
          block "$RUNNER_TEMP/debug.log" | head -6 | emit "[debug]"
          exit 1

      - name: Collect arm64-v8a APK
        run: |
          mkdir -p out
          find sing-box-for-android/app/build/outputs/apk -name '*arm64-v8a*.apk' -exec cp {} out/ \;
          ls -lh out
          test -n "$(ls out)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-trimmed-arm64-v8a
          path: out/*.apk
          retention-days: 14
